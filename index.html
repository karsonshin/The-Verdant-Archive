<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verdant Archive</title>
<meta name="description" content="Verdant Archive: a personal photo and video gallery by Karson Shin.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23365b3a'/%3E%3Cpath d='M7 25C7 14 13 8 25 7c0 11-6 17-16 17' fill='none' stroke='%23e9f2dc' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('va-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<button type="button" class="skip" onclick="document.getElementById('app').focus()">Skip to content</button>

<header class="site">
  <div class="wrap bar">
    <a class="brand" href="#/">
      <svg class="leaf" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27C5 14 13 5 27 5c0 13-8 21-19 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 27l13-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="brand-name">Verdant Archive</span>
    </a>
    <nav class="main" aria-label="Main">
      <a href="#/gallery">Gallery</a>
      <a href="#/albums">Albums</a>
      <a href="#/timeline">Timeline</a>
      <a href="#/places">Places</a>
      <a href="#/gear">Gear</a>
      <a href="#/about">About</a>
    </nav>
    <form class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search file names, tags, places, albums and dates" autocomplete="off" spellcheck="false">
    </form>
    <button id="theme" class="icon-btn" type="button" aria-label="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"><p class="loading">Opening the archive…</p></main>
<noscript><p class="wrap">Verdant Archive needs JavaScript to show the gallery.</p></noscript>

<footer class="site">
  <div class="wrap foot">
    <div class="foot-brand">
      <p class="brandline small"></p>
      <p class="muted fine">&copy; <span id="year"></span> <span id="owner"></span> · <span class="brand-name">Verdant Archive</span></p>
    </div>
    <div class="contact" hidden>
      <h2 class="contact-title">Contact</h2>
      <div class="contact-body"></div>
    </div>
  </div>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
