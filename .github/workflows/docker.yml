# Publishes the site image to GHCR on version tags (v1.2.3) or manually. Not on every push: the image carries all media.
name: Docker image
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: read, packages: write }

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: '${{ steps.meta.outputs.tags }}', cache-from: type=gha, cache-to: 'type=gha,mode=max' }
