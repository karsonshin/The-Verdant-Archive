server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # The gallery rewrites these on every ingest, so always revalidate them.
  location ~* ^/(index\.html|site\.config\.json|data/) { add_header Cache-Control "no-cache"; try_files $uri =404; }
  # Derivatives live under content-hash ids and never change in place.
  location /media/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
